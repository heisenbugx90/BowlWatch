# Store brand 'Companion' (Foodhold USA = Ahold Delhaize USA private label). 'Companion'
# alone is a common word: name is qualified and only label aliases identify it.
id: companion-ahold
name: Companion (Ahold Delhaize)
parent: ahold-delhaize
markets: [US]
aliases:
  - { text: Companion Dog Food, kind: label }
  - { text: Companion Cat Food, kind: label }
  - Companion Skin & Coat
  # 2017 rawhide recall labels (FDA iRES event 77441).
  - { text: Companion Natural Rawhide, kind: label }
  - { text: Companion Rawhide, kind: label }
  - { text: Companion Chicken Flavored Rawhide, kind: label }
  - { text: Companion Peanut Butter Rawhide, kind: label }
  # Bare "Companion" counts only with a corroborating firm (Ahold, or its chew maker United Pet Group).
  - { text: Companion, kind: short }
firm_names:
  - Foodhold USA LLC
manufacturers:
  - united-pet-group
  - simmons-foods
sources:
  - "https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/united-pet-group-expands-voluntary-recall-multiple-brands-rawhide-chew-products-dogs-also-include"
  - "https://www.accessdata.fda.gov/scripts/ires/index.cfm?action=export.getExportCSVResult&view=AdvancedSearch&page=product&criteria=%5B%7B%22productdescriptiontxt%22%3A%22%22%7D%2C%7B%22codeinformation%22%3A%22%22%7D%2C%7B%22centercd%22%3A%5B%22CVM%22%5D%7D%2C%7B%22centerclassificationtypetxt%22%3Anull%7D%2C%7B%22firmlegalnam%22%3A%22%22%7D%2C%7B%22phasetxt%22%3Anull%7D%2C%7B%22recalleventid%22%3A%2276403%22%7D%2C%7B%22recallnum%22%3A%22%22%7D%2C%7B%22productshortreasontxt%22%3A%22%22%7D%2C%7B%22centerclassificationdtfrom%22%3A%2201%2F01%2F2016%22%7D%2C%7B%22centerclassificationdtto%22%3A%2212%2F31%2F2026%22%7D%5D"
lines:
  - id: canned-dog
    name: Canned dog food
    aliases:
      - { text: Companion with Chicken and Rice, kind: label }
      - { text: Companion with Turkey and Bacon, kind: label }
      - { text: "Companion with Chicken, Lamb and Rice", kind: label }
    species: [dog]
    formats: [wet]
  - id: chews
    name: Chews
    # natural rawhide rolls, chips and chews (FDA iRES 77441)
    aliases: [Rawhide, Beefhide]
    species: [dog]
    formats: [treat]
