notes: >-
  St. Louis; bought Arthur Dogswell (Dogswell, Nutrisca) in 2017 and owns the
  Natural Life Pet Products trademark. Later owned by NXMH. On 2024-12-18 General
  Mills completed buying Whitebridge's North American "premium cat feeding and pet
  treating" business (Tiki Pets, Cloud Star incl. Dogswell treats). Whether the
  Nutrisca and Natural Life dog FOODS moved to General Mills is NOT verified; they
  stay here until a source says otherwise (see data/CURATION-LOG.md).
